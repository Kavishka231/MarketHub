services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: markethub
      POSTGRES_USER: markethub
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    volumes: ["markethub-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U markethub -d markethub"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["markethub-redis:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    image: ${REGISTRY_PREFIX:-markethub}/backend:${MARKETHUB_IMAGE_TAG:-local}
    build: ./backend
    environment:
      DB_HOST: database
      DB_PORT: 5432
      DB_NAME: markethub
      DB_USERNAME: markethub
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
      SPRING_PROFILES_ACTIVE: prod
      GIT_SHA: ${MARKETHUB_IMAGE_TAG:-unknown}
      BUILD_TIME: ${BUILD_TIME:-unknown}
      APP_ENVIRONMENT: ${APP_ENVIRONMENT:-staging}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports: ["8080:8080"]
    depends_on:
      database: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/readiness || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s

  frontend:
    image: ${REGISTRY_PREFIX:-markethub}/frontend:${MARKETHUB_IMAGE_TAG:-local}
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
    ports: ["3000:8080"]
    depends_on:
      backend: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6

  prometheus:
    image: prom/prometheus:v2.55.1
    profiles: ["monitoring"]
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=7d"]
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/rules:/etc/prometheus/rules:ro
      - markethub-prometheus:/prometheus
    ports: ["9090:9090"]
    depends_on:
      backend: { condition: service_healthy }

  grafana:
    image: grafana/grafana:11.3.1
    profiles: ["monitoring"]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - markethub-grafana:/var/lib/grafana
    ports: ["3001:3000"]
    depends_on: [prometheus]

volumes:
  markethub-data:
  markethub-redis:
  markethub-prometheus:
  markethub-grafana: