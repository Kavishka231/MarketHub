spring:
  application:
    name: markethub-api
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:markethub}
    username: ${DB_USERNAME:markethub}
    password: ${DB_PASSWORD:markethub}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

security:
  cors:
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:5173}
  jwt:
    secret: ${JWT_SECRET}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}

management:
  info:
    env:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    info:
      access: unrestricted
    health:
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db
      show-details: never
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

server:
  shutdown: graceful
spring.lifecycle.timeout-per-shutdown-phase: 20s
info:
  app:
    name: ${spring.application.name}
    version: "@project.version@"
    gitSha: ${GIT_SHA:unknown}
    buildTime: ${BUILD_TIME:unknown}
    environment: ${APP_ENVIRONMENT:${SPRING_PROFILES_ACTIVE:local}}
