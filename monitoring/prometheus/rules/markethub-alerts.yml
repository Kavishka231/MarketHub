groups:
  - name: markethub-local-staging
    rules:
      - alert: MarketHubBackendDown
        expr: up{job="markethub-backend"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: MarketHub backend is not being scraped
      - alert: MarketHubHighServerErrorRate
        expr: |
          sum(rate(http_server_requests_seconds_count{application="markethub",status=~"5.."}[5m]))
          / clamp_min(sum(rate(http_server_requests_seconds_count{application="markethub"}[5m])), 1) > 0.05
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Backend 5xx rate exceeds 5% in the local/staging window
      - alert: MarketHubHighP95Latency
        expr: |
          histogram_quantile(0.95, sum by (le) (
            rate(http_server_requests_seconds_bucket{application="markethub"}[5m])
          )) > 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Backend p95 latency exceeds one second
- alert: MarketHubDatabasePoolPressure
        expr: hikaricp_connections_active / clamp_min(hikaricp_connections_max, 1) > 0.85
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Database pool utilization exceeds 85%
      - alert: MarketHubElevatedRateLimiting
        expr: increase(markethub_rate_limit_rejections_total[10m]) > 100
        for: 5m
        labels:
          severity: info
        annotations:
          summary: More than 100 requests were rate limited in ten minutes