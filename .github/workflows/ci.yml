name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17", cache: maven }
      - working-directory: backend
        run: mvn --batch-mode --no-transfer-progress clean verify

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npm test -- --run
      - working-directory: frontend
        env: { VITE_API_BASE_URL: "https://api.example.invalid" }
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npx playwright install --with-deps chromium
      - working-directory: frontend
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: frontend/playwright-report, retention-days: 7 }

  infrastructure:
    runs-on: ubuntu-latest
    env:
      DB_PASSWORD: ci-compose-validation
      JWT_SECRET: bWFya2V0aHViLWNpLXZhbGlkYXRpb24tc2VjcmV0LW9ubHk=
      GRAFANA_ADMIN_PASSWORD: ci-grafana-validation
    steps:
      - uses: actions/checkout@v4
      - run: docker compose --profile monitoring config --quiet
      - run: docker build -t markethub/backend:${{ github.sha }} backend
      - run: docker build --build-arg VITE_API_BASE_URL=https://api.example.invalid -t markethub/frontend:${{ github.sha }} frontend
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
  recovery:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: markethub_source
          POSTGRES_USER: markethub_recovery
          POSTGRES_PASSWORD: recovery-test-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U markethub_recovery -d markethub_source"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USERNAME: markethub_recovery
      DB_PASSWORD: recovery-test-only
      PGPASSWORD: recovery-test-only
      JWT_SECRET: cmVjb3ZlcnktY2ktb25seS1qd3Qtc2VjcmV0LXdpdGgtMzItYnl0ZXM=
      REDIS_HOST: localhost
      REDIS_PORT: 6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17", cache: maven }
      - name: Validate recovery script safety rules
        shell: pwsh
        run: ./scripts/test-database-recovery-tools.ps1
      - name: Apply Flyway migrations through the application
        working-directory: backend
        env:
          DB_NAME: markethub_source
        run: |
          mvn --batch-mode --no-transfer-progress package -DskipTests
          java -jar target/*.jar > ../recovery-application.log 2>&1 &
          echo $! > ../recovery-application.pid
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:8080/actuator/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat ../recovery-application.log
          exit 1
      - name: Seed disposable source and create recovery target
        run: |
          psql --host=localhost --username=markethub_recovery --dbname=markethub_source --command="INSERT INTO users (first_name,last_name,email,password,role,status) VALUES ('Recovery','Fixture','recovery@example.invalid','not-a-real-password','CUSTOMER','ACTIVE');"
          psql --host=localhost --username=markethub_recovery --dbname=postgres --command="CREATE DATABASE markethub_recovery;"
      - name: Back up, restore, and verify disposable databases
        shell: pwsh
        run: ./scripts/verify-database-recovery.ps1
      - name: Stop migration application
        if: always()
        shell: bash
        run: if test -f recovery-application.pid && kill -0 "$(cat recovery-application.pid)" 2>/dev/null; then kill "$(cat recovery-application.pid)"; fi
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: recovery-verification-logs
          path: recovery-application.log
          retention-days: 7

  release-artifacts:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17", cache: maven }
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - name: Build backend artifact and CycloneDX SBOM
        working-directory: backend
        run: mvn --batch-mode --no-transfer-progress clean package -DskipTests
      - name: Build frontend artifact and CycloneDX SBOM
        working-directory: frontend
        env: { VITE_API_BASE_URL: "https://api.example.invalid" }
        run: |
          npm ci
          npm run build
          npm sbom --sbom-format=cyclonedx > frontend-sbom.json
          tar -czf frontend-dist.tar.gz -C dist .
      - name: Generate checksummed release manifest
        shell: pwsh
        run: |
          $jar = (Get-ChildItem backend/target/markethub-api-*.jar | Where-Object { $_.Name -notmatch 'original' } | Select-Object -First 1).FullName
          ./scripts/release.ps1 `
            -GitSha "${{ github.sha }}" `
            -ArtifactPath @($jar, "frontend/frontend-dist.tar.gz") `
            -SbomPath @("backend/target/classes/META-INF/sbom/application.cdx.json", "frontend/frontend-sbom.json") `
            -OutputDirectory "artifacts/release"
          ./scripts/test-release-tools.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: markethub-release-${{ github.sha }}
          path: artifacts/release
          if-no-files-found: error
          retention-days: 30
